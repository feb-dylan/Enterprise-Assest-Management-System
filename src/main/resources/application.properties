spring.application.name=eams-backend

# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/eams_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SERVER
# ==========================================

server.port=8080

# ==========================================
# MAIL
# ==========================================

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${PASSWORD}
spring.mail.password=${USERNAME}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=rubbyboo16@gmail.com
# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000