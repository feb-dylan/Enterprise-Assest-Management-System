spring.application.name=eams-backend

# Local secrets: put KEY=value lines in a ".env" file in the project root
# (it is git-ignored). Real environment variables still take priority.
spring.config.import=optional:file:.env[.properties]

# ==========================================
# DATABASE  (all secrets come from environment variables)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eams_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JPA / HIBERNATE
# ==========================================
# "update" keeps your existing data and adds the new columns/tables.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# SERVER
# ==========================================
server.port=${PORT:8080}

# ==========================================
# FILE UPLOADS
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
app.upload-dir=${UPLOAD_DIR:uploads}

# ==========================================
# MAIL (optional - notifications are skipped if not configured)
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@eams.local}

# ==========================================
# SECURITY
# ==========================================
# JWT_SECRET must be at least 32 characters (256-bit HMAC key)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.auth.public-registration=${PUBLIC_REGISTRATION:true}
app.auth.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:false}
app.auth.max-login-attempts=5
app.auth.lockout-minutes=15

# ==========================================
# URLS (used in emails and QR codes)
# ==========================================
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.backend-url=${BACKEND_URL:http://localhost:8080}

# ==========================================
# AI via OpenRouter (free models available) - optional
# Features are disabled until OPENROUTER_API_KEY and AI_MODEL are set.
# AI_MODEL must support tool calling; AI_VISION_MODEL must accept images
# (leave AI_VISION_MODEL empty to use AI_MODEL for both).
# ==========================================
app.ai.enabled=${AI_ENABLED:true}
app.ai.api-key=${OPENROUTER_API_KEY:}
app.ai.base-url=${AI_BASE_URL:https://openrouter.ai/api/v1}
app.ai.model=${AI_MODEL:}
app.ai.vision-model=${AI_VISION_MODEL:}

# ==========================================
# DEMO DATA
# ==========================================
# Roles are always created. Set SEED_DEMO_DATA=true once to load demo users/assets.
app.seed.demo-data=${SEED_DEMO_DATA:false}
app.seed.demo-password=${SEED_DEMO_PASSWORD:Password123!}

# ==========================================
# API DOCS
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
